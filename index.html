<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ad Knowledge Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M4 10.4v3.2c0 .8.6 1.4 1.4 1.4H7l1.1 3.2c.2.5.6.8 1.2.8h1.1c.8 0 1.4-.8 1.1-1.6L10.7 15H12l6.2 3.1c.8.4 1.8-.2 1.8-1.1V7c0-.9-1-1.5-1.8-1.1L12 9H5.4C4.6 9 4 9.6 4 10.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M20.5 9.2c1 .6 1.5 1.6 1.5 2.8s-.6 2.2-1.5 2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>广告知识训练器</h1>
          <p>Ad Knowledge Trainer</p>
        </div>
      </div>

      <nav class="nav-list">
        <button class="nav-item is-active" data-view="dashboard">
          <span class="nav-icon">⌂</span><span>首页</span>
        </button>
        <button class="nav-item" data-view="library">
          <span class="nav-icon">⌕</span><span>知识库</span>
        </button>
        <button class="nav-item" data-view="flashcards">
          <span class="nav-icon">□</span><span>闪卡</span>
        </button>
        <button class="nav-item" data-view="practice">
          <span class="nav-icon">✓</span><span>练习</span>
        </button>
        <button class="nav-item" data-view="mistakes">
          <span class="nav-icon">!</span><span>错题本</span>
        </button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL LEARNING SYSTEM</p>
          <h2 id="viewTitle">首页 Dashboard</h2>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" id="resetFiltersBtn" type="button">清空筛选</button>
          <button class="danger-button" id="resetProgressBtn" type="button">重置进度</button>
        </div>
      </header>

      <section class="view is-active" id="dashboardView" aria-labelledby="viewTitle"></section>
      <section class="view" id="libraryView" aria-labelledby="viewTitle"></section>
      <section class="view" id="detailView" aria-labelledby="viewTitle"></section>
      <section class="view" id="flashcardsView" aria-labelledby="viewTitle"></section>
      <section class="view" id="practiceView" aria-labelledby="viewTitle"></section>
      <section class="view" id="mistakesView" aria-labelledby="viewTitle"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
